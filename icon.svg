<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0a0f1c"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ea"/>
      <stop offset="45%" stop-color="#ffab4a"/>
      <stop offset="100%" stop-color="#ff8c50"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- arena boundary + the pulse rings the core sends outward -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="#5be3ff" stroke-width="6" opacity="0.30"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#5be3ff" stroke-width="5" opacity="0.45"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#5be3ff" stroke-width="4" opacity="0.62"/>
  <!-- the core -->
  <circle cx="256" cy="256" r="62" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="26" fill="#fff7ea"/>
  <!-- a severed shot: head plus trailing tail, the game's signature verb -->
  <path d="M120 392 L188 324" stroke="#ff5bd8" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <circle cx="196" cy="316" r="17" fill="#ff5bd8"/>
  <path d="M392 120 L324 188" stroke="#5be3ff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <circle cx="316" cy="196" r="17" fill="#5be3ff"/>
</svg>
